# The public site: static files from ../dist (built by scripts/build-site.sh), served by Cloudflare.
# index.js runs only for the main page, to give follow links (?w=10&watch=name) their own link preview.
name = "toronto-election-site"
main = "index.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [{ pattern = "torontoelections.andrewmcgrath.info", custom_domain = true }]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/index.html"]
