<script>
  // The results page moved. Carry this browser's saved settings (watched candidates, theme, ward...) along in the
  // URL fragment, which is never sent to a server; the new page stores them and removes them from the address.
  (function () {
    var KEYS = ['watch', 'theme', 'myWard', 'lastWard', 'openWards', 'cityView', 'faces', 'ticker', 'feedSeen', 'viewer', 'welcomed'];
    var data = {}, n = 0;
    try { KEYS.forEach(function (k) { var v = localStorage.getItem(k); if (v != null) { data[k] = v; n++; } }); } catch (e) {}
    var parts = [];
    var h = location.hash.slice(1);
    if (h) parts.push(h);
    if (n) { try { parts.push('migrate=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))))); } catch (e) {} }
    location.replace('https://torontoelections.andrewmcgrath.info/' + location.search + (parts.length ? '#' + parts.join('&') : ''));
  })();
</script>
