name = "toronto-election-2026"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "VIEWERS"
class_name = "Viewers"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Viewers"]

[[durable_objects.bindings]]
name = "NEWSROOM"
class_name = "Newsroom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Newsroom"]

[ai]
binding = "AI"

# The live feed ran every minute over election night: crons = ["* * 26-29 10 *"] (UTC dates, so that covered the
# evening of Oct 26 in Toronto). Off in archive mode; see docs/REVIVE.md.
[triggers]
crons = []
