name: Relay results feed

# The City's feed blocks cross-origin browser requests, so this job copies it
# into the `data` branch, which the static page reads through the GitHub API.
on:
  workflow_dispatch:
  schedule:
    # Every 10 min, Oct 26-28. Only one run is active at a time (see concurrency);
    # each run polls for ~55 min, so these are mostly restarts and backups.
    - cron: "*/10 * 26-28 10 *"

concurrency:
  group: relay
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Poll and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DURATION: "3300"
          INTERVAL: "45"
        run: python3 scripts/relay.py
